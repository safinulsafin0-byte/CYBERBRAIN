[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cyberbrain"
version = "1.0.0"
description = "A terminal-native dynamic Mixture-of-Experts engine for C++ algorithms & cybersecurity."
dependencies = [
    "torch",
    "transformers",
    "accelerate",
    "huggingface_hub"
]

[project.scripts]
cyberbrain = "cyberbrain:main"